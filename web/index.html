<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atomic – Cambridge Stage 7 Science</title>
<meta name="description" content="Cambridge Lower Secondary Science Stage 7 at home: lesson videos that ask questions, 30 practice questions per topic, Unit Tests and a certificate.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap">
<style>
#splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#fff 0,#F3F7FD 60%,#E7EFFB 100%);font-family:system-ui,Segoe UI,Arial,sans-serif;transition:opacity .4s ease,visibility .4s}
#splash.out{opacity:0;visibility:hidden}
#splash .sp-in{display:flex;flex-direction:column;align-items:center;gap:18px;color:#0E1B3D}
#splash img{height:46px;width:auto}
#splash b{font-size:16px;letter-spacing:.01em}
#splash .sp-bar{width:180px;height:5px;border-radius:9px;background:#DCE8FA;overflow:hidden}
#splash .sp-bar i{display:block;height:100%;width:40%;border-radius:9px;background:linear-gradient(90deg,#0149AF,#F3BF69);animation:spbar 1.2s ease-in-out infinite}
.sp-atom .orb,.atomspin .orb{transform-origin:32px 32px;animation:orb 1.6s linear infinite}
.sp-atom .o2,.atomspin .o2{animation-duration:2.1s;animation-direction:reverse}
.sp-atom .o3,.atomspin .o3{animation-duration:2.7s}
@keyframes orb{to{transform:rotate(360deg)}}
@keyframes spbar{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@media (prefers-reduced-motion:reduce){#splash *{animation:none!important}}
</style>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="splash" role="status" aria-live="polite">
  <div class="sp-in">
    <img src="atomic_logo.png" alt="Atomic" width="150" height="50">
    <svg class="sp-atom" width="96" height="96" viewBox="0 0 64 64" aria-hidden="true">
      <circle cx="32" cy="32" r="5" fill="#F3BF69"/>
      <g class="orb o1"><ellipse cx="32" cy="32" rx="27" ry="10" fill="none" stroke="#0149AF" stroke-width="2.4"/><circle cx="59" cy="32" r="3.4" fill="#0149AF"/></g>
      <g class="orb o2"><ellipse cx="32" cy="32" rx="27" ry="10" fill="none" stroke="#2F6FD6" stroke-width="2.4" transform="rotate(60 32 32)"/><circle cx="45.5" cy="55.4" r="3.4" fill="#2F6FD6"/></g>
      <g class="orb o3"><ellipse cx="32" cy="32" rx="27" ry="10" fill="none" stroke="#A9C6F2" stroke-width="2.4" transform="rotate(120 32 32)"/><circle cx="18.5" cy="55.4" r="3.4" fill="#C48A2C"/></g>
    </svg>
    <b>Loading your course</b>
    <span class="sp-bar"><i></i></span>
  </div>
</div>
<div id="app"></div>
<script src="config.js"></script>
<script src="loading.js"></script>
<script src="shared/grade-core.js"></script>
<script src="shared/test-rules.js"></script>
<script src="figures.js"></script>
<script src="figures2.js"></script>
<script src="figures3.js"></script>
<script src="unitart.js"></script>
<script src="paper.js"></script>
<script src="qengine.js"></script>
<script src="schools.js"></script>
<script src="backend.js"></script>
<script src="core.js"></script>
<script src="admin.js"></script>
<script src="app.js"></script>
<script src="mathtype.js"></script>
</body>
</html>

name: tts-relay
on:
  push:
    branches: [tts-relay]
    paths: [urls.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p out
          while read -r name url; do
            [ -n "$name" ] && curl -sSfL --retry 3 -o "out/$name" "$url"
          done < urls.txt
          ls -la out
          git config user.name "Atomic Education"
          git config user.email "mrphe996@users.noreply.github.com"
          git add out && git commit -qm "relay output" && git push -q
